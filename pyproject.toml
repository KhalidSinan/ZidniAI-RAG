[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kidsrag"
version = "0.1.0"
description = "Document-grounded RAG over one chapter of a children's computer science book"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymupdf>=1.26",
    "fastembed>=0.7",
    "rank-bm25>=0.2.2",
    "numpy>=2.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jupyterlab>=4.0",
]

[project.scripts]
kidsrag = "kidsrag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kidsrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
